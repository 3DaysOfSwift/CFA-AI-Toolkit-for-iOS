name: Draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (e.g. v0.3.0)
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node --input-type=module -e 'import fs from "node:fs"; if(process.env.RELEASE_TAG !== "v" + JSON.parse(fs.readFileSync("package.json")).version) process.exit(1);'
      - run: python3 scripts/release.py
      - run: git diff --exit-code
      - name: Create draft with downloadable archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          notes="docs/RELEASE-${RELEASE_TAG}.md"
          test -f "$notes"
          flags=(--verify-tag --draft --title "CFA AI Toolkit for iOS ${RELEASE_TAG}" --notes-file "$notes")
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS "${flags[@]}"
